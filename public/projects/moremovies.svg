<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Architecture de MoreMovies</title>
  <desc id="desc">Trois sources sont harmonisées avec Pentaho PDI, puis chargées dans une base intégrée et un entrepôt ROLAP analysé avec Mondrian, MDX et Power BI.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#e8f0ed"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef8a61"/>
      <stop offset="1" stop-color="#df5b2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102d2b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#df5b2d"/>
    </marker>
  </defs>

  <rect width="1400" height="650" fill="url(#paper)"/>
  <path d="M0 0h1400v112H0z" fill="#123f4b"/>
  <circle cx="1285" cy="54" r="145" fill="#df5b2d" opacity="0.16"/>
  <text x="58" y="54" fill="#faf8f2" font-family="Georgia, serif" font-size="33" font-weight="700">MoreMovies</text>
  <text x="58" y="85" fill="#bfd1d2" font-family="Verdana, sans-serif" font-size="14">CHAÎNE DÉCISIONNELLE DE BOUT EN BOUT</text>

  <g filter="url(#shadow)">
    <rect x="55" y="155" width="260" height="330" rx="18" fill="#fff"/>
    <rect x="355" y="220" width="205" height="200" rx="18" fill="url(#orange)"/>
    <rect x="600" y="198" width="210" height="244" rx="18" fill="#123f4b"/>
    <rect x="850" y="175" width="220" height="290" rx="18" fill="#fff"/>
    <rect x="1110" y="198" width="235" height="244" rx="18" fill="#102d2b"/>
  </g>

  <g font-family="Verdana, sans-serif">
    <text x="82" y="190" fill="#176076" font-size="12" font-weight="700" letter-spacing="2">03 SOURCES</text>
    <g fill="#edf3ef">
      <rect x="82" y="214" width="206" height="62" rx="10"/>
      <rect x="82" y="294" width="206" height="62" rx="10"/>
      <rect x="82" y="374" width="206" height="62" rx="10"/>
    </g>
    <g fill="#102d2b" font-size="16" font-weight="700">
      <text x="102" y="251">Buckboaster</text>
      <text x="102" y="331">Metrostarlet</text>
      <text x="102" y="411">MovieMegamart</text>
    </g>

    <g text-anchor="middle">
      <text x="457" y="260" fill="#fff4ed" font-size="12" font-weight="700" letter-spacing="2">ETL</text>
      <text x="457" y="304" fill="#fff" font-family="Georgia, serif" font-size="26" font-weight="700">Pentaho PDI</text>
      <text x="457" y="340" fill="#ffe1d2" font-size="13">40 transformations</text>
      <text x="457" y="367" fill="#ffe1d2" font-size="12">nettoyer · dédupliquer · harmoniser</text>

      <text x="705" y="240" fill="#b8d2d4" font-size="12" font-weight="700" letter-spacing="2">INTÉGRATION</text>
      <text x="705" y="287" fill="#fff" font-family="Georgia, serif" font-size="25" font-weight="700">mm_integrated</text>
      <text x="705" y="327" fill="#d7e5e5" font-size="13">clients · magasins</text>
      <text x="705" y="352" fill="#d7e5e5" font-size="13">produits · transactions</text>
      <rect x="638" y="382" width="134" height="31" rx="15" fill="#176076"/>
      <text x="705" y="402" fill="#faf8f2" font-size="11" font-weight="700">MODÈLE COMMUN</text>

      <text x="960" y="218" fill="#176076" font-size="12" font-weight="700" letter-spacing="2">ENTREPÔT ROLAP</text>
      <text x="960" y="265" fill="#102d2b" font-family="Georgia, serif" font-size="25" font-weight="700">mm_warehouse</text>
      <text x="960" y="308" fill="#3f5652" font-size="13">4 dimensions</text>
      <text x="960" y="336" fill="#3f5652" font-size="13">2 tables de faits</text>
      <text x="960" y="364" fill="#3f5652" font-size="13">3 agrégats mensuels</text>
      <rect x="895" y="400" width="130" height="32" rx="16" fill="#f4ded3"/>
      <text x="960" y="421" fill="#c44e27" font-size="11" font-weight="700">SCHÉMA EN ÉTOILE</text>

      <text x="1227" y="240" fill="#b8d2d4" font-size="12" font-weight="700" letter-spacing="2">ANALYSE</text>
      <text x="1227" y="287" fill="#fff" font-family="Georgia, serif" font-size="25" font-weight="700">Mondrian</text>
      <text x="1227" y="322" fill="#d7e5e5" font-size="13">3 cubes · 5 requêtes MDX</text>
      <line x1="1162" y1="351" x2="1292" y2="351" stroke="#456b70"/>
      <text x="1227" y="393" fill="#ef8a61" font-size="18" font-weight="700">Power BI</text>
    </g>
  </g>

  <g fill="none" stroke="#df5b2d" stroke-width="4" marker-end="url(#arrow)">
    <path d="M315 320h31"/>
    <path d="M560 320h31"/>
    <path d="M810 320h31"/>
    <path d="M1070 320h31"/>
  </g>

  <g font-family="Verdana, sans-serif">
    <text x="55" y="548" fill="#176076" font-size="11" font-weight="700" letter-spacing="2">RÉSULTAT</text>
    <text x="55" y="584" fill="#102d2b" font-family="Georgia, serif" font-size="25">Une donnée comparable, traçable et prête pour la décision.</text>
    <text x="1345" y="580" fill="#3f5652" font-size="12" text-anchor="end">MySQL · PDI · OLAP · BI</text>
  </g>
</svg>
